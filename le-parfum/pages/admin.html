<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin - Le Parfum</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <div class="logo">Le Parfum</div>
        <div class="sub">Painel Administrativo</div>
      </div>
      <nav class="admin-nav">
        <div class="admin-nav-item active" data-tab="dashboard">
          <span class="nav-icon">📊</span> Dashboard
        </div>
        <div class="admin-nav-item" data-tab="pedidos">
          <span class="nav-icon">📦</span> Pedidos
        </div>
        <div class="admin-nav-item" data-tab="usuarios">
          <span class="nav-icon">👤</span> Usuários
        </div>
        <div class="admin-nav-item" onclick="Auth.logout()" style="color:var(--danger);margin-top:auto;">
          <span class="nav-icon">🚪</span> Sair
        </div>
      </nav>
    </aside>
    
    <main class="admin-main">
      <div class="admin-topbar">
        <h2 id="admin-title">Dashboard</h2>
        <span style="color:var(--gray);font-size:0.9rem;">Bem-vindo, Admin</span>
      </div>
      
      <div class="admin-content">
        <div id="admin-dashboard">
          <div class="stats-grid" id="admin-stats">
            <p>Carregando estatísticas...</p>
          </div>
          <div class="admin-card">
            <div class="admin-card-header">
              <h3>Últimos Pedidos</h3>
            </div>
            <div id="admin-orders">Carregando...</div>
          </div>
        </div>
        
        <div id="admin-orders-container" style="display:none;">
          <div class="admin-card">
            <div class="admin-card-header">
              <h3>Gerenciar Pedidos</h3>
            </div>
            <div id="admin-orders-list">Carregando...</div>
          </div>
        </div>
        
        <div id="admin-users-container" style="display:none;">
          <div class="admin-card">
            <div class="admin-card-header">
              <h3>Gerenciar Usuários</h3>
            </div>
            <div id="admin-users-list">Carregando...</div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <script src="../js/app.js"></script>
</body>
</html>
