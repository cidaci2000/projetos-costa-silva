<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Beka Esporte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-color: #2d1b4e;
            --secondary-color: #a78bdb;
            --light-bg: #f3e8ff;
            --shadow: 0 10px 30px rgba(45, 27, 78, 0.1);
            --shadow-lg: 0 20px 50px rgba(45, 27, 78, 0.15);
            --danger: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d1b4e 0%, #3d2461 50%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            font-size: 2rem;
            color: var(--primary-color);
        }
        .login-header h1 span {
            color: var(--secondary-color);
        }
        .login-header p {
            color: #6b5b95;
            margin-top: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e9d5ff;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
        }
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: var(--primary-color);
            transform: translateY(-2px);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }
        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block;
        }
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #6b5b95;
        }
        .register-link a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #6b5b95;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--primary-color);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>BEKA<span>ESPORTE</span></h1>
            <p>Faça login para acessar sua conta</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label>🔒 Senha</label>
                <input type="password" id="loginPassword" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">🚀 Entrar</span>
            </button>
        </form>

        <div class="register-link">
            Não tem uma conta? <a href="#" onclick="window.location.href='index.html#login'">Cadastre-se</a>
        </div>
        <a href="index.html" class="back-link">← Voltar para a Loja</a>
    </div>

    <script>
    const API_URL = 'api_auth.php';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('alertMessage');
        
        // Reset alert
        alertDiv.className = 'alert';
        alertDiv.style.display = 'none';
        
        // Validação básica
        if (!email || !password) {
            showAlert('Por favor, preencha todos os campos.', 'danger');
            return;
        }

        // Desabilitar botão
        btn.disabled = true;
        btn.innerHTML = '<span class="btn-text"><span class="loading"></span> Entrando...</span>';

        try {
            console.log('🔍 Tentando login com:', email);
            
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', email, password })
            });

            const result = await response.json();
            console.log('📦 Resposta do servidor:', result);

            if (result.success) {
                // Salvar dados do usuário
                localStorage.setItem('user', JSON.stringify(result.user));
                console.log('👤 Usuário salvo:', result.user);
                console.log('👑 Role:', result.user.role);
                
                // Verificar se é admin
                if (result.user.role === 'admin') {
                    showAlert('✅ Login realizado com sucesso! Redirecionando para o painel admin...', 'success');
                    setTimeout(() => {
                        console.log('🚀 Redirecionando para admin.html');
                        window.location.href = 'admin.html';
                    }, 1000);
                } else {
                    showAlert('✅ Login realizado com sucesso! Redirecionando para a loja...', 'success');
                    setTimeout(() => {
                        console.log('🚀 Redirecionando para index.html');
                        window.location.href = 'index.html';
                    }, 1000);
                }
            } else {
                showAlert('❌ ' + (result.message || 'Falha no login. Verifique suas credenciais.'), 'danger');
                btn.disabled = false;
                btn.innerHTML = '<span class="btn-text">🚀 Entrar</span>';
            }
        } catch (error) {
            console.error('❌ Erro no login:', error);
            showAlert('❌ Erro ao conectar com o servidor. Verifique sua conexão.', 'danger');
            btn.disabled = false;
            btn.innerHTML = '<span class="btn-text">🚀 Entrar</span>';
        }
    });

    function showAlert(message, type) {
        const alertDiv = document.getElementById('alertMessage');
        alertDiv.textContent = message;
        alertDiv.className = 'alert alert-' + type;
        alertDiv.style.display = 'block';
    }

    // Se já estiver logado, redirecionar
    document.addEventListener('DOMContentLoaded', function() {
        const user = localStorage.getItem('user');
        console.log('📌 Usuário no localStorage:', user);
        if (user) {
            try {
                const userData = JSON.parse(user);
                console.log('👤 Dados do usuário:', userData);
                if (userData.role === 'admin') {
                    console.log('👑 É admin, redirecionando para admin.html');
                    window.location.href = 'admin.html';
                } else {
                    console.log('👤 É usuário comum, redirecionando para index.html');
                    window.location.href = 'index.html';
                }
            } catch(e) {
                console.error('❌ Erro ao parsear user:', e);
                localStorage.removeItem('user');
            }
        }
    });
    </script>
</body>
</html>
