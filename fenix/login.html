<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - FÊNIX Imobiliária</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1D5775 0%, #15445c 50%, #3a7b9c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        :root {
            --primary: #1D5775;
            --primary-dark: #15445c;
            --gold: #c9a84c;
            --gold-dark: #b08d3a;
            --gray-border: #dce6ef;
            --text-muted: #5e7483;
            --shadow: 0 20px 40px -12px rgba(0,0,0,0.3);
        }

        .login-container {
            background: white;
            border-radius: 2.5rem;
            padding: 2.5rem 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
            border-top: 5px solid var(--gold);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .logo-icon {
            background: var(--primary);
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 2rem;
            margin: 0 auto 0.8rem;
            box-shadow: 0 8px 16px -6px rgba(29, 87, 117, 0.3);
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .login-header h1 span {
            font-weight: 300;
            color: var(--gold);
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e2b37;
            margin-bottom: 0.3rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--gray-border);
            border-radius: 60px;
            font-size: 0.95rem;
            background: #f0f4f9;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: var(--gold);
            background: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
        }

        .btn-block {
            width: 100%;
            padding: 0.8rem;
            border-radius: 60px;
            font-weight: 700;
            border: none;
            background: var(--gold);
            color: #1e2b37;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }

        .btn-block:hover {
            background: var(--gold-dark);
            box-shadow: 0 4px 12px rgba(201, 168, 76, 0.3);
            transform: translateY(-2px);
        }

        .btn-block:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert {
            padding: 0.7rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .register-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #1e2b37;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        @media (max-width: 480px) {
            .login-container { padding: 1.8rem 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon"><i class="fas fa-fire"></i></div>
            <h1>FÊNIX<span>.</span></h1>
            <p>Faça login para acessar sua conta</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>📧 E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label>🔒 Senha</label>
                <input type="password" id="loginPassword" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-block" id="loginBtn">
                <span class="btn-text">🚀 Entrar</span>
            </button>
        </form>

        <div class="register-link">
            Não tem uma conta? <a href="#" onclick="window.location.href='index.html'">Cadastre-se</a>
        </div>
        <a href="index.html" class="back-link">← Voltar para a Loja</a>
    </div>

    <script>
        const API_URL = 'api_auth.php';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const alertDiv = document.getElementById('alertMessage');
            
            alertDiv.className = 'alert';
            alertDiv.style.display = 'none';
            
            if (!email || !password) {
                showAlert('Por favor, preencha todos os campos.', 'danger');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="btn-text"><span class="loading"></span> Entrando...</span>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', email, password })
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('user', JSON.stringify(result.user));
                    
                    if (result.user.role === 'admin' || result.user.role === 'corretor') {
                        showAlert('✅ Login realizado! Redirecionando para o painel...', 'success');
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        showAlert('✅ Login realizado com sucesso!', 'success');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    }
                } else {
                    showAlert('❌ ' + (result.message || 'Falha no login.'), 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '<span class="btn-text">🚀 Entrar</span>';
                }
            } catch (error) {
                console.error('Erro no login:', error);
                showAlert('❌ Erro ao conectar com o servidor.', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<span class="btn-text">🚀 Entrar</span>';
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.textContent = message;
            alertDiv.className = 'alert alert-' + type;
            alertDiv.style.display = 'block';
        }

        // Verificar se já está logado
        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('user');
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    if (userData.role === 'admin' || userData.role === 'corretor') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } catch(e) {
                    localStorage.removeItem('user');
                }
            }
        });
    </script>
</body>
</html>
