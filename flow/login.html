<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Flow Biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #DBBC87;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-container {
      background: #FFFFFF;
      border-radius: 2rem;
      padding: 2.5rem 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2);
      border-top: 5px solid #b8860b;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .login-header h1 span {
      color: #b8860b;
    }

    .login-header p {
      color: #666;
      font-size: 0.95rem;
      margin-top: 0.2rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 0.3rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1.5px solid #d4c2a6;
      border-radius: 1.8rem;
      font-size: 1rem;
      background: #f5f2ec;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .form-group input:focus {
      border-color: #b8860b;
      background: white;
      outline: none;
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.2);
    }

    .btn-block {
      width: 100%;
      padding: 0.8rem;
      border-radius: 3rem;
      font-weight: 700;
      border: 1.8px solid #d4c2a6;
      background: #FFFFFF;
      color: #000000;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.5rem;
    }

    .btn-block:hover {
      background: #f5f2ec;
      border-color: #b8860b;
      transform: scale(0.98);
    }

    .btn-block:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .alert {
      padding: 0.7rem 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      display: none;
    }

    .alert-danger {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }

    .register-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #666;
      font-size: 0.95rem;
    }

    .register-link a {
      color: #000;
      font-weight: 700;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #999;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: #000;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: #000;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-text {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    @media (max-width: 480px) {
      .login-container { padding: 1.8rem 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>📚 Flow <span>·</span></h1>
      <p>Faça login para acessar sua biblioteca</p>
    </div>

    <div id="alertMessage" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>📧 E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" required autofocus>
      </div>
      <div class="form-group">
        <label>🔒 Senha</label>
        <input type="password" id="loginPassword" placeholder="Digite sua senha" required>
      </div>
      <button type="submit" class="btn-block" id="loginBtn">
        <span class="btn-text">🚀 Entrar</span>
      </button>
    </form>

    <div class="register-link">
      Não tem uma conta? <a href="#" onclick="window.location.href='index.html'">Cadastre-se</a>
    </div>
    <a href="index.html" class="back-link">← Voltar para a Biblioteca</a>
  </div>

  <script>
    const API_URL = 'api_auth.php';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      const alertDiv = document.getElementById('alertMessage');

      alertDiv.className = 'alert';
      alertDiv.style.display = 'none';

      if (!email || !password) {
        showAlert('Por favor, preencha todos os campos.', 'danger');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="btn-text"><span class="loading"></span> Entrando...</span>';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', email, password })
        });

        const result = await response.json();

        if (result.success) {
          localStorage.setItem('user', JSON.stringify(result.user));

          if (result.user.role === 'admin' || result.user.role === 'bibliotecario') {
            showAlert('✅ Login realizado! Redirecionando para o painel...', 'success');
            setTimeout(() => {
              window.location.href = 'admin.html';
            }, 1000);
          } else {
            showAlert('✅ Login realizado com sucesso!', 'success');
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1000);
          }
        } else {
          showAlert('❌ ' + (result.message || 'Falha no login.'), 'danger');
          btn.disabled = false;
          btn.innerHTML = '<span class="btn-text">🚀 Entrar</span>';
        }
      } catch (error) {
        console.error('Erro no login:', error);
        showAlert('❌ Erro ao conectar com o servidor.', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<span class="btn-text">🚀 Entrar</span>';
      }
    });

    function showAlert(message, type) {
      const alertDiv = document.getElementById('alertMessage');
      alertDiv.textContent = message;
      alertDiv.className = 'alert alert-' + type;
      alertDiv.style.display = 'block';
    }

    // Verificar se já está logado
    document.addEventListener('DOMContentLoaded', function() {
      const user = localStorage.getItem('user');
      if (user) {
        try {
          const userData = JSON.parse(user);
          if (userData.role === 'admin' || userData.role === 'bibliotecario') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        } catch(e) {
          localStorage.removeItem('user');
        }
      }
    });
  </script>
</body>
</html>
